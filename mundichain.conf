# ==============================================================================
# CONFIGURAÇÃO OFICIAL: NÓ MUNDICHAIN (MINI SERVIDOR CASEIRO LINUX)
# Modo: Nó Validador Neutro da Rede P2P (Sem custódia de carteira / Sem mineração interna)
# ==============================================================================

# [REDE P2P - ALTA CAPACIDADE]
port=18444
listen=1
maxconnections=500

# [SERVIDOR RPC (API JSON PRIVADA)]
server=1
rpcport=18445
rpcuser=mundiadmin
rpcpassword=mundi_super_secret_key_2026
rpcallowip=127.0.0.1
rpcallowip=192.168.*.*

# [BANCO DE DADOS E ARMAZENAMENTO]
prune=0
dbcache=150

# [CONTROLE DE MINERAÇÃO NO SERVIDOR]
# Desativado (gen=0). O nó atua estritamente como validador neutro.
# As moedas são mineradas pelos mineradores externos ou carteira desktop via Coinbase.
gen=0
genproclimit=0
